[package]
name = "common-rust"
version = "1.1.2"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lexpr = "0.2"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
which = "8.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "common_rust"
path = "src/lib.rs"
